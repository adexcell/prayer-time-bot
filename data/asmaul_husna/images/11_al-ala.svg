<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Inter:wght@400;600&amp;display=swap');
      .arabic {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif;
        font-size: 80px;
        fill: url(#gold-grad);
        text-anchor: middle;
        direction: rtl;
        unicode-bidi: isolate;
        dominant-baseline: central;
        font-feature-settings: "liga" 1, "calt" 1, "mark" 1, "mkmk" 1;
        font-variant-ligatures: contextual common-ligatures;
      }
      .translit {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 600;
        fill: #ffffff;
        text-anchor: middle;
      }
      .translation {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #a7f3d0;
        text-anchor: middle;
      }
      .frame {
        stroke: #34d399;
        stroke-opacity: 0.35;
        stroke-width: 1.5;
        fill: none;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="28" fill="url(#bg-grad)" />

  <!-- Decorative Inner Frame -->
  <rect x="14" y="14" width="572" height="292" rx="20" class="frame" />

  <!-- Arabic Calligraphy / Typography -->
  <text x="300" y="125" class="arabic" xml:lang="ar" direction="rtl">الأَعْلَيٰ</text>

  <!-- Transliteration and Translation -->
  <text x="300" y="225" class="translit">Аль-А‘ля</text>
  <text x="300" y="265" class="translation">Всевышний, Высочайший</text>
</svg>